name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm run check
      - run: npm test
      - run: python3 -m unittest discover -s collector -p test_datum.py
      - run: python3 -m unittest discover -s collector/ratum -p test_ratum.py
      - run: python3 collector/package.py --check
      - run: python3 -m unittest discover -s collector/adapter-kit -p test_uploader.py
      - run: python3 collector/package-adapter.py --check
      - run: docker build -t xbtpulse:test .

